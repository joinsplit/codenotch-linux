[package]
name = "codenotch"
version = "0.3.0"
edition = "2021"
description = "Codenotch for Linux — usage notch for Claude, Codex, Cursor and Antigravity"
license = "MIT"
repository = "https://github.com/joinsplit/codenotch-linux"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
dirs = "5"
notify = "6"
ureq = { version = "2", features = ["json", "native-tls"] } # native-tls: the Antigravity local bridge's self-signed certificate is accepted for 127.0.0.1 only
native-tls = "0.2"
png = "0.17" # application icon → PNG (provider marks taken from the installed app's resources)
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Cursor's credential lives in state.vscdb (SQLite); bundled = compile the SQLite C sources with the crate, which adds 1–2 minutes to the first build
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"   # the version Tauri 2 itself links; used only to mark the notch window unfocusable / always on top
x11rb = "0.13" # pure-Rust X client: pointer button state, active window, jump-back activation (XWayland on a Wayland session)
libc = "0.2"   # setpriority for the background probes

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security_Credentials",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_Globalization",
  "Win32_System_Console",
] }
